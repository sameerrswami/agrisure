services:
  - type: web
    name: agrisure-web
    runtime: python
    buildCommand: ./build.sh
    startCommand: gunicorn agrisure.wsgi:application --bind 0.0.0.0:$PORT --workers 3 --threads 2 --timeout 60
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.18
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: .onrender.com,localhost,127.0.0.1
      - key: DATABASE_URL
        fromDatabase:
          name: agrisure-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: agrisure-redis
          property: connectionString
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false

  - type: redis
    name: agrisure-redis
    ipAllowList: []
    plan: free
    maxmemoryPolicy: noeviction

databases:
  - name: agrisure-db
    databaseName: agrisure_db
    user: agrisure_user
    plan: free
