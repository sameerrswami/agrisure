{% extends 'base.html' %}
{% block title %}Edit Profile – AgriSure{% endblock %}
{% block content %}
<div class="max-w-xl mx-auto px-4 py-12 space-y-6">
    <h1 class="font-heading text-2xl font-bold text-forest-900">Edit Account Details</h1>
    <div class="glass-card p-8 bg-white rounded-3xl border border-gray-200 shadow-lg">
        <form method="post" enctype="multipart/form-data" class="space-y-4">
            {% csrf_token %}
            <div class="form-group">
                <label class="form-label">First Name</label>
                {{ form.first_name }}
            </div>
            <div class="form-group">
                <label class="form-label">Last Name</label>
                {{ form.last_name }}
            </div>
            <div class="form-group">
                <label class="form-label">Phone Number</label>
                {{ form.phone }}
            </div>
            <button type="submit" class="btn btn-primary w-full py-3">Save Changes</button>
        </form>
    </div>
</div>
{% endblock %}
