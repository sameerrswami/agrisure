{% extends 'base.html' %}
{% block title %}Reset Password – AgriSure{% endblock %}
{% block content %}
<div class="min-h-[70vh] flex items-center justify-center py-12 px-4">
    <div class="w-full max-w-md space-y-6">
        <div class="text-center">
            <h2 class="font-heading text-3xl font-extrabold text-forest-900">Forgot Password?</h2>
            <p class="text-sm text-gray-600 mt-2">Enter your email and we'll send you a password reset link.</p>
        </div>
        <div class="glass-card p-8 bg-white rounded-3xl border border-gray-200 shadow-xl">
            <form method="post" class="space-y-4">
                {% csrf_token %}
                <div class="form-group">
                    <label class="form-label">Email Address</label>
                    {{ form.email }}
                </div>
                <button type="submit" class="btn btn-primary w-full py-3">Send Reset Link</button>
            </form>
            <div class="mt-4 text-center">
                <a href="{% url 'accounts:login' %}" class="text-xs font-semibold text-emerald-700 hover:underline">Back to Login</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
