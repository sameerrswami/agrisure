{% extends 'base.html' %}
{% block title %}Set New Password – AgriSure{% endblock %}
{% block content %}
<div class="min-h-[70vh] flex items-center justify-center py-12 px-4">
    <div class="w-full max-w-md space-y-6">
        <div class="text-center">
            <h2 class="font-heading text-3xl font-extrabold text-forest-900">Set New Password</h2>
        </div>
        <div class="glass-card p-8 bg-white rounded-3xl border border-gray-200 shadow-xl">
            <form method="post" class="space-y-4">
                {% csrf_token %}
                <div class="form-group">
                    <label class="form-label">New Password</label>
                    {{ form.password }}
                </div>
                <div class="form-group">
                    <label class="form-label">Confirm Password</label>
                    {{ form.password_confirm }}
                </div>
                <button type="submit" class="btn btn-primary w-full py-3">Update Password</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
