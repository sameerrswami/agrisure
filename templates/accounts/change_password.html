{% extends 'base.html' %}
{% block title %}Change Password – AgriSure{% endblock %}
{% block content %}
<div class="max-w-md mx-auto px-4 py-12 space-y-6">
    <h1 class="font-heading text-2xl font-bold text-forest-900">Update Password</h1>
    <div class="glass-card p-8 bg-white rounded-3xl border border-gray-200 shadow-lg">
        <form method="post" class="space-y-4">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary w-full py-3 mt-4">Save New Password</button>
        </form>
    </div>
</div>
{% endblock %}
